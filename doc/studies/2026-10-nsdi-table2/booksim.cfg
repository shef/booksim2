// Calibrated latencies: 1 cycle = 1 ns, 1 flit = 200 B on a 1.6 Tb/s link.
// Topology, routes, buffers and VCs are set on the command line by run.py.
topology = fabric;

router = iq;
num_vcs = 4;
vc_buf_size = 512;
wait_for_tail_credit = 0;
vc_allocator = separable_input_first;
sw_allocator = separable_input_first;
alloc_iters = 1;
credit_delay = 2;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;

traffic = uniform;
packet_size = 8;
sim_type = latency;
// BookSim aborts runs whose average latency exceeds latency_thres (default
// 500 cycles); calibrated zero-load latency is already ~900 ns.
latency_thres = 50000.0;
warmup_periods = 3;
sample_period = 10000;
max_samples = 10;
sim_count = 1;
