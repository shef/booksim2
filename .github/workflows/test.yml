name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y flex bison
      - name: Build
        run: make -C src -j"$(nproc)"
      - name: Test
        run: make -C src test
